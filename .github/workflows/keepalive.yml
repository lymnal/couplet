# Supabase's free tier pauses a project after ~a week without API traffic —
# which silently kills sync for every parlor (it happened to this app's
# previous life). One tiny read every 3 days keeps the backend awake.
# The URL and publishable key are the same public values shipped in config.js.
name: keepalive
on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: |
          curl -sf -X POST "https://dmacixbmjwqyjabuynvj.supabase.co/rest/v1/rpc/get_room" \
            -H "apikey: sb_publishable_ByUZkQH1TYzS7yv1wR0dsg_-2-9IPDX" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}' > /dev/null
